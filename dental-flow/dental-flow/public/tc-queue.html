<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TC Room — Dental Flow</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>Dental Flow</div>
  <div class="station-pill"><span>Station:</span> <strong id="stationName">—</strong> <button id="stationLogout">Switch</button></div>
  <div id="waitingBadge" class="waiting-badge"><span class="count"></span><span class="label"></span></div>
  <nav>
    <a href="/">Front Desk</a>
    <a href="/operatory">Operatories</a>
    <a href="/tc-queue" class="active">TC Room</a>
    <a href="/dashboard">Live Dashboard</a>
    <a href="/doctor-queue">Doctor Queue</a>
    <a href="/analytics">Analytics</a>
    <a href="/activity-log">Activity Log</a>
  </nav>
</div>

<main>
  <h1>TC Room</h1>
  <p class="subtitle">Patients sent over by the doctor. Mark them when they arrive, and again when they head to checkout.</p>

  <div id="queue" class="grid grid-3"></div>
  <div id="empty" class="empty-state panel" style="display:none">No patients waiting for the treatment coordinator.</div>
</main>

<script src="/js/common.js"></script>
<script>
async function refresh() {
  const [queueRes, activeRes] = await Promise.all([
    fetch('/api/tc-queue'),
    fetch('/api/visits/active'),
  ]);
  render(await queueRes.json());
  updateWaitingBadge(await activeRes.json());
}
window.__refreshCurrentPage = refresh;

function render(queue) {
  const el = document.getElementById('queue');
  const empty = document.getElementById('empty');
  if (!queue.length) {
    el.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  el.innerHTML = queue.map(v => {
    const isWaiting = !!v.waitingFor;
    const level = isWaiting ? waitLevel(v.currentWaitSeconds) : 'green';
    return `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="color:var(--ink-soft);font-size:13px">${escapeHtml(v.operatory || '—')}</div>
          <span class="pill ${isWaiting ? 'pill-' + level : 'pill-neutral'}">${escapeHtml(STATUS_LABEL[v.status] || v.status)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px">
          <div style="font-size:18px;font-weight:700">Patient ${escapeHtml(v.patientId)}</div>
          ${editButtonHtml(v.id)}
        </div>
        <div class="timer timer-lg timer-${level}" style="margin-bottom:16px">${isWaiting ? fmtDuration(v.currentWaitSeconds) : '—'}</div>
        ${v.tcNextAction ? `<button class="btn btn-primary" style="width:100%;padding:14px" onclick="act(${v.id}, '${v.tcNextAction.action}')">${v.tcNextAction.label}</button>` : ''}
        <div style="text-align:center;margin-top:10px">${cancelButtonHtml(v.id, v.patientId)}</div>
      </div>
    `;
  }).join('');
}

async function act(visitId, action) {
  try {
    await postJSON(`/api/visits/${visitId}/transition`, { action, role: getStation() });
    refresh();
  } catch (e) {
    toast(e.message);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

initTopbar();
loadThresholds();
connectRealtime(refresh);
setInterval(refresh, 1000);
</script>
</body>
</html>
