<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Change Password — Dental Flow</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<main style="max-width:400px;margin:0 auto;padding-top:12vh">
  <div style="text-align:center;margin-bottom:24px">
    <div style="display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--ink);margin-bottom:6px">
      <span style="width:12px;height:12px;border-radius:50%;background:var(--teal)"></span>
      Dental Flow
    </div>
    <p class="subtitle" id="intro" style="margin:0">Choose a new password.</p>
  </div>

  <div class="panel">
    <form id="pwForm">
      <label for="currentPassword">Current (or temporary) password</label>
      <input type="password" id="currentPassword" autocomplete="current-password" required />
      <div style="height:14px"></div>
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" autocomplete="new-password" required />
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px">At least 10 characters, with at least one letter and one number.</div>
      <div style="height:14px"></div>
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" required />
      <div style="height:16px"></div>
      <div id="pwError" class="edit-error"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;font-size:15px">Save Password</button>
    </form>
  </div>
  <p style="text-align:center;font-size:12px;margin-top:16px"><a href="#" id="logoutLink">Log out</a></p>
</main>

<script src="/js/common.js"></script>
<script>
document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); fullLogout(); });

getJSON('/api/me').then((me) => {
  document.getElementById('intro').textContent = me.mustChangePassword
    ? `Hi ${me.displayName} — please choose your own password before continuing.`
    : 'Choose a new password.';
}).catch(() => {});

document.getElementById('pwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('pwError');
  errorEl.textContent = '';
  const newPassword = document.getElementById('newPassword').value;
  if (newPassword !== document.getElementById('confirmPassword').value) {
    errorEl.textContent = "The new passwords don't match";
    return;
  }
  try {
    await postJSON('/api/change-password', {
      currentPassword: document.getElementById('currentPassword').value,
      newPassword,
    });
    toast('Password saved');
    const station = getStation();
    setTimeout(() => { window.location.href = station ? stationHome(station) : '/station'; }, 600);
  } catch (err) {
    errorEl.textContent = err.message;
  }
});
</script>
</body>
</html>
