<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doctor Queue — Dental Flow</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>Dental Flow</div>
  <div class="station-pill"><span>Station:</span> <strong id="stationName">—</strong> <button id="stationLogout">Switch</button></div>
  <div id="waitingBadge" class="waiting-badge"><span class="count"></span><span class="label"></span></div>
  <nav>
    <a href="/">Front Desk</a>
    <a href="/operatory">Operatories</a>
    <a href="/tc-queue">TC Room</a>
    <a href="/dashboard">Live Dashboard</a>
    <a href="/doctor-queue" class="active">Doctor Queue</a>
    <a href="/analytics">Analytics</a>
    <a href="/activity-log">Activity Log</a>
  </nav>
</div>

<main>
  <h1>Doctor Queue</h1>
  <p class="subtitle">Patients currently waiting for the doctor, longest wait first.</p>

  <div id="queue" class="grid grid-3"></div>
  <div id="empty" class="empty-state panel" style="display:none">No patients waiting for the doctor.</div>
</main>

<script src="/js/common.js"></script>
<script>
async function refresh() {
  const res = await fetch('/api/doctor-queue');
  const queue = await res.json();
  render(queue);
}
window.__refreshCurrentPage = refresh;

function render(queue) {
  const el = document.getElementById('queue');
  const empty = document.getElementById('empty');
  if (!queue.length) {
    el.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  el.innerHTML = queue.map(v => {
    const level = waitLevel(v.currentWaitSeconds);
    return `
      <div class="panel">
        <div style="color:var(--ink-soft);font-size:13px;margin-bottom:6px">${escapeHtml(v.operatory || '—')}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
          <div style="font-size:20px;font-weight:700">Patient ${escapeHtml(v.patientId)}</div>
          ${editButtonHtml(v.id)}
        </div>
        <span class="pill pill-${level}">Waiting for Doctor</span>
        <div class="timer timer-lg timer-${level}" style="margin-top:14px">${fmtDuration(v.currentWaitSeconds)}</div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

initTopbar();
loadThresholds();
connectRealtime(refresh);
setInterval(refresh, 1000);
</script>
</body>
</html>
