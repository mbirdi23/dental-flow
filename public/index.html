<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Front Desk — Dental Flow</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-frontdesk">

<div class="topbar">
  <div class="brand"><span class="dot"></span>Dental Flow</div>
  <div class="station-pill"><span>Station:</span> <strong id="stationName">—</strong></div>
  <div id="waitingBadge" class="waiting-badge"><span class="count"></span><span class="label"></span></div>
  <nav>
    <a href="/" class="active">Front Desk</a>
    <a href="/operatory">Operatories</a>
    <a href="/tc-queue">TC Room</a>
    <a href="/dashboard">Live Dashboard</a>
    <a href="/doctor-queue">Doctor Queue</a>
    <a href="/analytics">Analytics</a>
    <a href="/activity-log">Activity Log</a>
  </nav>
</div>

<main>
  <div class="panel fd-section checkin-panel">
    <form id="checkinForm" class="checkin-row">
      <h2>Check In</h2>
      <input type="text" id="firstName" placeholder="First name" aria-label="First name" autocomplete="off" maxlength="40" />
      <input type="text" id="patientId" placeholder="Patient ID (optional)" aria-label="Patient ID (optional)" autocomplete="off" maxlength="40" />
      <button type="submit" class="btn btn-primary checkin-btn">Check In</button>
    </form>
  </div>

  <div class="fd-grid">
    <div>
      <div class="panel fd-section">
        <h2>Doing Paperwork</h2>
        <div id="paperworkList"></div>
      </div>
      <div class="panel fd-section">
        <h2>Waiting Room</h2>
        <div id="waitingAssistantList"></div>
      </div>
    </div>
    <div>
      <div class="panel fd-section">
        <h2>Rooms</h2>
        <div id="roomsOverview" class="rooms-overview"></div>
      </div>
      <div class="fd-pair">
        <div class="panel fd-section">
          <h2><a class="panel-link" href="/tc-queue" title="Open TC Room">TC Queue →</a></h2>
          <div id="tcQueueList"></div>
        </div>
        <div class="panel fd-section">
          <h2>Ready to Complete</h2>
          <div id="readyToCompleteList"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
async function refresh() {
  const visits = await getJSON('/api/visits/active');
  const rooms = await getJSON('/api/rooms');
  const occupiedOps = new Map(visits.filter(v => v.operatory).filter(v => v.inRoom).map(v => [v.operatory, v.firstName || v.patientId || 'a patient']));

  renderPaperwork(visits.filter(v => v.status === 'doing_paperwork'));
  renderWaitingAssistant(visits.filter(v => v.status === 'waiting_assistant'), occupiedOps, rooms);
  renderReadyToComplete(visits.filter(v => v.status === 'with_tc'));
  renderRoomsOverview(visits, rooms);
  renderTcQueue(visits);
  updateWaitingBadge(visits);
}
window.__refreshCurrentPage = refresh;

// All six rooms at a glance: who's in each one and what stage they're at.
function renderRoomsOverview(visits, rooms) {
  // Each card is a link to that room's screen.
  document.getElementById('roomsOverview').innerHTML = OPERATORIES.map((op) => {
    const href = `/operatory?room=${encodeURIComponent(op)}`;
    const v = visits.find((x) => x.operatory === op && x.inRoom);
    if (v) {
      const level = v.waitingFor ? waitLevel(v.currentWaitSeconds) : null;
      return `<a class="room-card room-card-link" href="${href}" title="Open ${op}">
        <div class="room-card-op">${op}</div>
        <div class="room-card-name">${patientLabel(v)}</div>
        <span class="pill ${level ? 'pill-' + level : 'pill-neutral'}">${escapeHtml(STATUS_LABEL[v.status] || v.status)}</span>
        ${level ? `<span class="timer timer-sm timer-${level}">${fmtDuration(v.currentWaitSeconds)}</span>` : ''}
        ${v.treatmentFlag ? treatmentBadgeHtml(true) : ''}
      </a>`;
    }
    const room = cleaningFor(rooms, op);
    if (room) {
      const mins = Math.max(0, Math.floor((Date.now() - new Date(room.cleaningSince).getTime()) / 60000));
      return `<a class="room-card room-card-link room-card-cleaning" href="${href}" title="Open ${op}"><div class="room-card-op">${op}</div><div>🧽 Being broken down, ${mins < 1 ? 'just started' : mins + ' min'}</div></a>`;
    }
    return `<a class="room-card room-card-link room-card-empty" href="${href}" title="Open ${op}"><div class="room-card-op">${op}</div><div>Empty</div></a>`;
  }).join('');
}

// TC Queue: who is with the treatment coordinator (first) and who is waiting.
// Clicking a TC Queue row opens the TC Room screen (the pencil still edits).
function openTcRoom(event) {
  if (event && event.target.closest('button, a')) return;
  window.location.href = '/tc-queue';
}

function renderTcQueue(visits) {
  const el = document.getElementById('tcQueueList');
  const tc = visits
    .filter((v) => v.status === 'waiting_tc' || v.status === 'with_tc')
    .sort((a, b) => (b.status === 'with_tc') - (a.status === 'with_tc') || b.currentWaitSeconds - a.currentWaitSeconds);
  if (!tc.length) { el.innerHTML = '<div class="empty-state">No one is with or waiting for the treatment coordinator.</div>'; return; }
  el.innerHTML = tc.map((v) => {
    const waiting = v.status === 'waiting_tc';
    const level = waiting ? waitLevel(v.currentWaitSeconds) : null;
    return `<div class="fd-row fd-row-link" onclick="openTcRoom(event)" title="Open TC Room">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <strong>${patientLabel(v)}</strong>
        ${editButtonHtml(v.id)}
        ${treatmentBadgeHtml(v.treatmentFlag)}
        <span class="room-card-from">from ${escapeHtml(v.operatory || '—')}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="pill ${level ? 'pill-' + level : 'pill-neutral'}">${waiting ? 'Waiting' : 'With TC'}</span>
        ${level ? `<span class="timer timer-sm timer-${level}">${fmtDuration(v.currentWaitSeconds)}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderPaperwork(visits) {
  const el = document.getElementById('paperworkList');
  if (!visits.length) { el.innerHTML = '<div class="empty-state">No one is doing paperwork.</div>'; return; }
  el.innerHTML = visits.map(v => `
    <div class="fd-row">
      <div class="wr-who"><strong>${patientLabel(v)}</strong>${editButtonHtml(v.id)}${treatmentBadgeHtml(v.treatmentFlag)}</div>
      <button class="btn btn-primary btn-xs" onclick="doTransition(${v.id}, 'ready_for_assistant')">Send to Waiting Room</button>
    </div>`).join('');
}

function renderWaitingAssistant(visits, occupiedOps, rooms = []) {
  const el = document.getElementById('waitingAssistantList');
  if (!visits.length) { el.innerHTML = '<div class="empty-state">No one is waiting.</div>'; return; }
  const sorted = [...visits].sort((a, b) => b.currentWaitSeconds - a.currentWaitSeconds);
  el.innerHTML = sorted.map(v => `
    <div class="wr-row">
      <div class="wr-who"><strong>${patientLabel(v)}</strong>${editButtonHtml(v.id)}${treatmentBadgeHtml(v.treatmentFlag)}</div>
      <span class="timer timer-sm timer-${waitLevel(v.currentWaitSeconds)}">${fmtDuration(v.currentWaitSeconds)}</span>
      <div class="op-mini">${OPERATORIES.map(op => {
        const occupiedBy = occupiedOps.get(op);
        const cleaning = !occupiedBy && cleaningFor(rooms, op);
        return `<button class="btn btn-secondary btn-xs" ${occupiedBy ? 'disabled' : ''} title="${occupiedBy ? 'Someone is already in this room' : cleaning ? 'Being broken down' : 'Send to ' + op}" onclick="assignOperatory(${v.id}, '${op}')">${op}${occupiedBy ? ' •' : cleaning ? ' 🧽' : ''}</button>`;
      }).join('')}</div>
      ${cancelButtonHtml(v.id)}
    </div>`).join('');
}

function renderReadyToComplete(visits) {
  const el = document.getElementById('readyToCompleteList');
  if (!visits.length) { el.innerHTML = '<div class="empty-state">No one is ready to complete.</div>'; return; }
  el.innerHTML = visits.map(v => `
    <div class="fd-row">
      <div class="wr-who"><strong>${patientLabel(v)}</strong>${editButtonHtml(v.id)}${treatmentBadgeHtml(v.treatmentFlag)}<span class="room-card-from">${escapeHtml(v.operatory || '')}</span></div>
      <button class="btn btn-primary btn-xs" onclick="doTransition(${v.id}, 'complete')">Complete Visit</button>
    </div>`).join('');
}

async function assignOperatory(visitId, operatory) {
  try {
    await postJSON(`/api/visits/${visitId}/transition`, { action: 'assign_operatory', operatory, role: getStation() });
    toast(`Patient sent to ${operatory}`);
    refresh();
  } catch (e) { toast(e.message); }
}

async function doTransition(visitId, action) {
  try {
    await postJSON(`/api/visits/${visitId}/transition`, { action, role: getStation() });
    toast('Updated');
    refresh();
  } catch (e) { toast(e.message); }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('checkinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('patientId');
  const nameInput = document.getElementById('firstName');
  const patientId = input.value.trim();
  const firstName = nameInput.value.trim();
  if (!patientId && !firstName) { toast('Enter a first name or a Patient ID'); return; }
  try {
    const visit = await postJSON('/api/visits', { patient_id: patientId || null, patient_first_name: firstName || null });
    await postJSON(`/api/visits/${visit.id}/transition`, { action: 'start_paperwork', role: getStation() });
    toast(`${firstName || 'Patient ' + patientId} checked in`);
    input.value = '';
    nameInput.value = '';
    refresh();
  } catch (e2) { toast(e2.message); }
});

initTopbar();
loadThresholds();
connectRealtime(refresh);
setInterval(refresh, 1000); // keep timers ticking live between events
</script>
</body>
</html>
