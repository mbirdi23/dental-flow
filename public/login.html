<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Dental Flow</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<main style="max-width:720px;margin:0 auto;padding-top:12vh">
  <div style="text-align:center;margin-bottom:36px">
    <div style="display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--ink);margin-bottom:6px">
      <span style="width:12px;height:12px;border-radius:50%;background:var(--teal)"></span>
      Dental Flow
    </div>
    <p class="subtitle" style="margin:0">Select this station to sign in.</p>
  </div>

  <div id="stationGroups"></div>

  <p style="text-align:center;color:var(--ink-soft);font-size:12px;margin-top:24px">
    This just picks which screen you're using — no password needed.
  </p>
</main>

<script src="/js/common.js"></script>
<script>
async function init() {
  let stations = ['Upfront','OP1','OP2','OP3','OP4','OP5','OP6','Lab','TC Room','Back Office'];
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    if (cfg.stations && cfg.stations.length) stations = cfg.stations;
  } catch (e) {
    // fall back to the default list above
  }

  const routeFor = (s) => {
    if (s === 'Upfront') return '/';
    if (/^OP\d+$/.test(s)) return '/my-room';
    if (s === 'TC Room') return '/tc-queue';
    if (s === 'Lab') return '/dashboard';
    if (s === 'Back Office') return '/analytics';
    return '/';
  };

  const groups = [
    { label: 'Front Desk', match: (s) => s === 'Upfront' },
    { label: 'Operatories', match: (s) => /^OP\d+$/.test(s) },
    { label: 'Other', match: (s) => true },
  ];

  const container = document.getElementById('stationGroups');
  container.innerHTML = groups.map((g) => {
    const remaining = stations.filter((s) => g.match(s) && !groups.slice(0, groups.indexOf(g)).some((prev) => prev.match(s)));
    if (!remaining.length) return '';
    const gridHtml = remaining.length === 1
      ? `<div style="max-width:200px;margin:0 auto"><button class="login-btn" data-station="${remaining[0]}" style="width:100%">${remaining[0]}</button></div>`
      : `<div class="login-grid">${remaining.map((s) => `<button class="login-btn" data-station="${s}">${s}</button>`).join('')}</div>`;
    return `
      <div style="margin-bottom:28px">
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:10px;text-align:center">${g.label}</div>
        ${gridHtml}
      </div>
    `;
  }).join('');

  container.querySelectorAll('[data-station]').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = btn.dataset.station;
      setStation(s);
      window.location.href = routeFor(s);
    });
  });
}
init();
</script>
</body>
</html>
