<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Room — Dental Flow</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>Dental Flow</div>
  <div class="station-pill"><span>Station:</span> <strong id="stationName">—</strong></div>
  <div id="waitingBadge" class="waiting-badge"><span class="count"></span><span class="label"></span></div>
  <nav>
    <a href="/">Front Desk</a>
    <a href="/operatory" class="active">My Room</a>
    <a href="/tc-queue">TC Room</a>
    <a href="/dashboard">Live Dashboard</a>
    <a href="/doctor-queue">Doctor Queue</a>
    <a href="/analytics">Analytics</a>
    <a href="/activity-log">Activity Log</a>
  </nav>
</div>

<main>
  <h1 id="roomTitle">My Room</h1>
  <p class="subtitle">This screen only shows your room. You can take a patient all the way through to Complete Visit from here.</p>
  <div id="content"></div>
</main>

<script src="/js/common.js"></script>
<script>
const ROOM = getStation(); // e.g. "OP3"
document.getElementById('roomTitle').textContent = ROOM || 'My Room';
document.title = (ROOM || 'My Room') + ' — Dental Flow';

async function refresh() {
  const [visits, rooms] = await Promise.all([getJSON('/api/visits/active'), getJSON('/api/rooms')]);
  renderRoomView(document.getElementById('content'), ROOM, visits, rooms);
  updateWaitingBadge(visits);
}
window.__refreshCurrentPage = refresh;

if (!isOpStation(ROOM)) {
  window.location.replace('/operatory');
} else {
  initTopbar();
  loadThresholds();
  connectRealtime(refresh);
  setInterval(refresh, 1000);
}
</script>
</body>
</html>
