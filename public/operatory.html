<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operatories — Dental Flow</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>Dental Flow</div>
  <div class="station-pill"><span>Station:</span> <strong id="stationName">—</strong> <button id="stationLogout">Switch</button></div>
  <div id="waitingBadge" class="waiting-badge"><span class="count"></span><span class="label"></span></div>
  <nav>
    <a href="/">Front Desk</a>
    <a href="/operatory" class="active">Operatories</a>
    <a href="/tc-queue">TC Room</a>
    <a href="/dashboard">Live Dashboard</a>
    <a href="/doctor-queue">Doctor Queue</a>
    <a href="/analytics">Analytics</a>
    <a href="/activity-log">Activity Log</a>
  </nav>
</div>

<main>
  <h1>Operatories</h1>
  <p class="subtitle">All six chairs at a glance. Act on any of them from here.</p>

  <div id="grid" class="op-board-grid"></div>
</main>

<script src="/js/common.js"></script>
<script>
async function refresh() {
  const res = await fetch('/api/visits/active');
  const visits = await res.json();
  render(visits);
  updateWaitingBadge(visits);
}
window.__refreshCurrentPage = refresh;

function render(visits) {
  const grid = document.getElementById('grid');
  grid.innerHTML = OPERATORIES.map((op) => {
    const visit = visits.find((v) => v.operatory === op);
    if (!visit) {
      return `
        <div class="panel op-card">
          <div class="op-card-head"><div class="op-name">${op}</div></div>
          <div class="empty-state" style="padding:40px 10px">No patient assigned</div>
        </div>
      `;
    }
    const isWaiting = !!visit.waitingFor;
    const level = isWaiting ? waitLevel(visit.currentWaitSeconds) : 'green';

    return `
      <div class="panel op-card">
        <div class="op-card-head">
          <div class="op-name">${op}</div>
          <span class="pill ${isWaiting ? 'pill-' + level : 'pill-neutral'}">${escapeHtml(STATUS_LABEL[visit.status] || visit.status)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin:10px 0 16px">
          <div style="font-size:22px;font-weight:700">Patient ${escapeHtml(visit.patientId)}</div>
          ${editButtonHtml(visit.id)}
        </div>
        <div style="display:flex;gap:28px;margin-bottom:18px">
          <div>
            <div style="color:var(--ink-soft);font-size:12px;margin-bottom:4px">${isWaiting ? 'Current Wait' : 'With Staff'}</div>
            ${isWaiting ? `<div class="timer timer-md timer-${level}">${fmtDuration(visit.currentWaitSeconds)}</div>` : `<div class="timer timer-md" style="color:var(--line)">—</div>`}
          </div>
          <div>
            <div style="color:var(--ink-soft);font-size:12px;margin-bottom:4px">Total Idle</div>
            <div class="timer timer-md" style="color:var(--ink)">${fmtDuration(visit.totalIdleSeconds)}</div>
          </div>
        </div>
        ${renderActionButton(visit)}
        <div style="text-align:center;margin-top:10px">${cancelButtonHtml(visit.id, visit.patientId)}</div>
      </div>
    `;
  }).join('');
}

function renderActionButton(visit) {
  if (visit.nextAction) {
    return `<button class="btn btn-primary" style="width:100%;padding:16px;font-size:15px;border-radius:10px" onclick="act(${visit.id}, '${visit.nextAction.action}')">${visit.nextAction.label}</button>`;
  }
  if (visit.status === 'waiting_tc' || visit.status === 'with_tc') {
    return `<div class="empty-state" style="padding:14px 0;font-size:13px">Being handled at TC Room</div>`;
  }
  if (visit.status === 'waiting_checkout' || visit.status === 'with_checkout') {
    return `<div class="empty-state" style="padding:14px 0;font-size:13px">Being handled at Front Desk</div>`;
  }
  return `<div class="empty-state" style="padding:14px 0;font-size:13px">Waiting for front desk hand-off</div>`;
}

async function act(visitId, action) {
  try {
    await postJSON(`/api/visits/${visitId}/transition`, { action, role: getStation() });
    refresh();
  } catch (e) {
    toast(e.message);
  }
}

initTopbar();
loadThresholds();
connectRealtime(refresh);
setInterval(refresh, 1000);
</script>
</body>
</html>
