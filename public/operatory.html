<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operatories — Dental Flow</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>Dental Flow</div>
  <div class="station-pill"><span>Station:</span> <strong id="stationName">—</strong></div>
  <div id="waitingBadge" class="waiting-badge"><span class="count"></span><span class="label"></span></div>
  <nav>
    <a href="/">Front Desk</a>
    <a href="/operatory" class="active">Operatories</a>
    <a href="/tc-queue">TC Room</a>
    <a href="/dashboard">Live Dashboard</a>
    <a href="/doctor-queue">Doctor Queue</a>
    <a href="/analytics">Analytics</a>
    <a href="/activity-log">Activity Log</a>
  </nav>
</div>

<main>
  <h1>Operatories</h1>
  <p class="subtitle">Pick a room to see only that room. Live Dashboard shows everyone at once.</p>
  <div id="roomTabs" class="room-tabs" role="tablist" aria-label="Rooms"></div>
  <h2 id="roomTitle" class="room-title"></h2>
  <div id="content"></div>
</main>

<script src="/js/common.js"></script>
<script>
// Shows ONE operatory at a time. ?room=OP2 in the address picks the room
// (so a screen can be bookmarked); otherwise the last room picked here.
const ROOM_KEY = 'dental_flow_board_room';
function initialRoom() {
  const fromUrl = new URLSearchParams(window.location.search).get('room');
  if (OPERATORIES.includes(fromUrl)) return fromUrl;
  try {
    const saved = localStorage.getItem(ROOM_KEY);
    if (OPERATORIES.includes(saved)) return saved;
  } catch (e) {}
  return OPERATORIES[0];
}
let ROOM = initialRoom();

function selectRoom(op) {
  if (!OPERATORIES.includes(op)) return;
  ROOM = op;
  try { localStorage.setItem(ROOM_KEY, op); } catch (e) {}
  window.history.replaceState(null, '', `/operatory?room=${encodeURIComponent(op)}`);
  refresh();
}

async function refresh() {
  const [visits, rooms] = await Promise.all([getJSON('/api/visits/active'), getJSON('/api/rooms')]);
  document.getElementById('roomTabs').innerHTML = OPERATORIES.map((op) => {
    const occ = visits.find((v) => v.operatory === op && v.inRoom);
    const state = occ ? escapeHtml(STATUS_LABEL[occ.status] || occ.status) : cleaningFor(rooms, op) ? '🧽 Being broken down' : 'Empty';
    return `<button class="room-tab" role="tab" aria-selected="${op === ROOM}" onclick="selectRoom('${op}')"><strong>${op}</strong><span>${state}</span></button>`;
  }).join('');
  document.getElementById('roomTitle').textContent = ROOM;
  renderRoomView(document.getElementById('content'), ROOM, visits, rooms);
  updateWaitingBadge(visits);
}
window.__refreshCurrentPage = refresh;

if (!redirectOpStationAwayFromBoard()) {
  initTopbar();
  loadThresholds();
  connectRealtime(refresh);
  setInterval(refresh, 1000);
}
</script>
</body>
</html>
